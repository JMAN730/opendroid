name: Claude Code

# Mention @claude in an issue or PR comment (or in a new issue's title/body) and
# Claude responds in a comment on that same thread, pushing commits when asked.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Only 'opened': without an assignee_trigger configured, 'assigned' would
  # start a second run for every assignment of an issue still containing
  # @claude.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Respond to @claude
    # Keeps a runner from starting on the comments that don't mention @claude.
    # The action re-checks the trigger phrase itself before responding.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Required for the action's GitHub App authentication
      # Scopes the workflow's own GITHUB_TOKEN. It does NOT reach the App token
      # Claude actually uses - see additional_permissions on the step below.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Must match JavaVersion.VERSION_21 / jvmTarget '21' in app/build.gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Read-only: @claude runs shouldn't evict the cache entries android-ci.yml
      # seeds from main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB (set below) strips the action's GH_TOKEN
      # from every Bash subprocess, and the runner carries no stored gh login, so
      # gh would fail with "gh auth login". Hand the wrapper a credential through
      # a 0600 file instead: it is this job's own GITHUB_TOKEN, so it is capped by
      # the permissions block above and expires with the job.
      - name: Stage a gh credential outside the scrubbed environment
        env:
          GH_CREDENTIAL: ${{ github.token }}
        run: |
          install -m 600 /dev/null "$HOME/.claude-gh-token"
          printf '%s' "$GH_CREDENTIAL" > "$HOME/.claude-gh-token"
          chmod +x .github/scripts/gh-repo.sh

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Off unless set: action.yml only defaults it on for
          # allowed_non_write_users. Scrubs Anthropic/cloud/Actions secrets from
          # subprocess environments, so a Gradle task can't read the OAuth token
          # out of its own env, and adds PID-namespace isolation where
          # bubblewrap is available.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # The job-level actions: read above scopes GITHUB_TOKEN, but Claude
          # authenticates as the Claude GitHub App, whose token is minted by a
          # separate exchange. That exchange sends contents/pull_requests/issues
          # write and nothing else unless additional_permissions is set, so
          # without this the mcp__github_ci__* tools fail on every API call.
          additional_permissions: |
            actions: read

          # These add to the tools the action already grants itself in tag mode
          # (Read/Grep/Glob/LS, comment updating, CI log reading, git commit and
          # push) - --allowedTools accumulates across flags rather than
          # replacing. Anything not listed falls through to "ask", which a
          # headless run denies, so new commands go here.
          #
          # Tracker access goes through .github/scripts/gh-repo.sh, never bare
          # gh. AGENTS.md scopes the tracker to this fork and forbids touching
          # the yashab-cyber/opendroid upstream, and GH_REPO cannot enforce that
          # - it is only a default, and every gh issue/pr subcommand accepts
          # -R/--repo. The wrapper rejects those flags, appends its own --repo,
          # and supplies the credential the subprocess scrub removes.
          #
          # Subcommands are listed individually rather than as a single
          # wildcard, so `gh api` (arbitrary writes), `gh pr merge`,
          # `gh workflow run`, and `gh secret` stay out of reach of anything a
          # mention injects - the wrapper enforces the same list itself.
          claude_args: |
            --max-turns 30
            --append-system-prompt "AGENTS.md tells you to use the gh CLI for issue and PR work. In this workflow bare gh is not allowed: run .github/scripts/gh-repo.sh instead, with the same arguments you would pass to gh (for example: .github/scripts/gh-repo.sh issue list --state open). The wrapper targets JMAN730/opendroid and rejects -R/--repo, so never pass a repository."
            --allowedTools "Bash(./gradlew:*),Bash(.github/scripts/gh-repo.sh issue view:*),Bash(.github/scripts/gh-repo.sh issue list:*),Bash(.github/scripts/gh-repo.sh issue create:*),Bash(.github/scripts/gh-repo.sh issue comment:*),Bash(.github/scripts/gh-repo.sh issue edit:*),Bash(.github/scripts/gh-repo.sh issue close:*),Bash(.github/scripts/gh-repo.sh pr view:*),Bash(.github/scripts/gh-repo.sh pr list:*),Bash(.github/scripts/gh-repo.sh pr diff:*),Bash(.github/scripts/gh-repo.sh pr comment:*)"
