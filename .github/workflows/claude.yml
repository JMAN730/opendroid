name: Claude Code

# Mention @claude in an issue or PR comment (or in a new issue's title/body) and
# Claude responds in a comment on that same thread, pushing commits when asked.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: Respond to @claude
    # Keeps a runner from starting on the comments that don't mention @claude.
    # The action re-checks the trigger phrase itself before responding.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Required for the action's GitHub App authentication
      actions: read # Lets Claude read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Must match JavaVersion.VERSION_21 / jvmTarget '21' in app/build.gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Read-only: @claude runs shouldn't evict the cache entries android-ci.yml
      # seeds from main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # AGENTS.md scopes the issue tracker to this fork and forbids touching
          # the yashab-cyber/opendroid upstream. gh resolves a fork's default
          # repo to its parent, so pin it explicitly rather than relying on
          # every gh call passing --repo.
          GH_REPO: ${{ github.repository }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # These add to the tools the action already grants itself in tag mode
          # (Read/Grep/Glob/LS, comment updating, CI log reading, git commit and
          # push) - --allowedTools accumulates across flags rather than
          # replacing. Anything not listed falls through to "ask", which a
          # headless run denies, so new commands go here.
          #
          # gh is authenticated: the action exports GH_TOKEN for its own use.
          # Subcommands are listed individually rather than as Bash(gh:*) to
          # keep `gh api` (arbitrary writes), `gh pr merge`, `gh workflow run`,
          # and `gh secret` out of reach of anything a mention injects.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(./gradlew:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
