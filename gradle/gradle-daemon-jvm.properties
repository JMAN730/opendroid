# Daemon JVM criteria (see `./gradlew updateDaemonJvm`).
#
# Pins the Gradle daemon to Java 21, the version this project targets
# (sourceCompatibility/targetCompatibility VERSION_21, jvmTarget '21',
# jvmToolchain(21) in app/build.gradle, and temurin 21 in CI).
#
# Without this, `./gradlew` runs the daemon on whatever JAVA_HOME points at.
# Gradle 8.10.2 cannot run on Java 24 or newer, so contributors on a recent JDK
# had to switch their JAVA_HOME by hand before every build. Gradle now selects an
# installed JDK 21 itself.
#
# A JDK 21 must still be installed locally - Gradle 8.10.2 will not download one.
toolchainVersion=21
