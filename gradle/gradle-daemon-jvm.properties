# Daemon JVM criteria (see `./gradlew updateDaemonJvm`).
#
# Pins the Gradle daemon to Java 21, the version this project targets
# (sourceCompatibility/targetCompatibility VERSION_21, jvmTarget '21',
# jvmToolchain(21) in app/build.gradle, and temurin 21 in CI).
#
# Without this, `./gradlew` runs the daemon on whatever JAVA_HOME points at, and
# contributors on a newer JDK than the project targets had to switch their
# JAVA_HOME by hand before every build. Gradle now selects an installed JDK 21
# itself.
#
# A JDK 21 must still be installed locally - Gradle will not download one.
toolchainVersion=21
